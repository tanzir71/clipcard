name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: |
          pnpm prepare:assets
          pnpm --filter @clipcard/extension exec wxt build --mode r4-preview -b chrome
        env:
          VITE_CLIPCARD_LANGUAGES: '1'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CLIPCARD_TEST_R4_PREVIEW: '1'
